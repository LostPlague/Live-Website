# Netlify deploy config — the site is the Vite + React app in ./app
[build]
  base = "app"              # run the build from the app/ subdirectory
  command = "npm run build" # tsc -b && vite build
  publish = "dist"          # output (resolved as app/dist)

# Pin the Node version so Netlify's build matches a known-good toolchain
# (Vite 8 needs Node 18+). Prevents version-mismatch build failures.
[build.environment]
  NODE_VERSION = "20"

# Serverless backend for the /admin Control Center: holds the PostHog personal
# key + admin password server-side and proxies analytics queries. Resolved as
# app/netlify/functions. (/.netlify/functions/* is exempt from the SPA redirect.)
[functions]
  directory = "netlify/functions"

# Resume-download alerts. The 15m interval is load-bearing: alerts.mjs reads the
# window [now-20m, now-5m], which is exactly 15 minutes wide so consecutive runs
# tile without overlapping (double emails) or leaving a gap (missed downloads).
# Change one and you must change the other.
[functions."alerts"]
  schedule = "*/15 * * * *"

# SPA fallback: serve index.html for every path so React Router owns routing.
# Without this, deep links like /os and any page refresh would 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
